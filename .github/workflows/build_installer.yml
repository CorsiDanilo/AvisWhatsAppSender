name: Build & Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate version against package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node -e '
            const pkg = require("./package.json");
            const tag = process.env.TAG_NAME.replace(/^v/, "");
            if (pkg.version !== tag) {
              console.error(`ERRORE: La versione in package.json (${pkg.version}) non corrisponde al tag Git (${tag})!`);
              process.exit(1);
            }
            console.log(`Versione verificata con successo: v${pkg.version}`);
          '

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix gui ci

      - name: Bundle Chromium for WhatsApp
        run: npm run prebuild:win

      - name: Build React GUI
        run: npm run build:gui

      - name: Build Windows Executable
        run: npx electron-builder --win nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AVIS-WhatsApp-Sender-Windows
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        # Pinnato a SHA immutabile per prevenire supply-chain attacks (v2.6.2 = ultima v2)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
